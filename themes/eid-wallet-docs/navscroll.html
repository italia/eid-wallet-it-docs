{%- if display_toc -%}
{%- from "components/icons.html" import icon_close, icon_chevron_right with context -%}
<nav class="navbar it-navscroll-wrapper navbar-expand-lg it-top-navscroll it-left-side it-docs-navscroll"
     data-bs-navscroll
     aria-label="{{ _('Page contents') }}">
  <div class="navbar-collapsable it-docs-navscroll-panel" id="itDocsNavscroll">
    <div class="overlay"></div>
    <div class="close-div">
      <button class="btn close-menu" type="button" aria-label="{{ _('Close page contents') }}">
        {{ icon_close() }}
      </button>
    </div>
    <div class="menu-wrapper it-docs-menu-scroll">
      <div class="link-list-wrapper">
        <div class="it-docs-navscroll-heading">
          <h2 class="it-docs-nav-section-label">{{ _('On this page') }}</h2>
          <button type="button"
                  class="btn it-docs-navscroll-collapse-toggle"
                  data-it-docs-navscroll-desktop-toggle
                  aria-controls="itDocsNavscroll"
                  aria-expanded="true"
                  aria-label="{{ _('Hide page contents') }}">
            {{ icon_chevron_right('icon icon-sm') }}
          </button>
        </div>
        <div class="it-docs-local-toc">
          {{ toc }}
        </div>
      </div>
    </div>
  </div>
</nav>
{%- endif -%}
